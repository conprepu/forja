<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Forja · Entreno y comida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a gym logbook that's quiet and exact, numbers first
   IDEA: the lifter's training card + a nutrition label, in one pocket app
   PICTURE: the live calorie ring and the set table are the picture
   COLOUR and TYPE: chalk white / iron charcoal, one cobalt accent, macro colours from nutrition labels; Archivo for figures, Inter for text
   LAYOUT: one phone column, sticky header, bottom tab bar, sheets from below */
:root{color-scheme:light dark;
--bg:light-dark(#f4f4f1,#0f1112);--card:light-dark(#ffffff,#1a1d20);--ink:light-dark(#121416,#f1f2f3);
--mut:light-dark(#686e74,#9aa1a8);--line:light-dark(#e3e3de,#2a2e32);--soft:light-dark(#ececE7,#23272b);
--acc:light-dark(#2b5cff,#6b8cff);--accink:#fff;--ok:light-dark(#11895a,#3fcf8e);--okbg:light-dark(#e3f5ec,#12301f);
--p:light-dark(#d93a3f,#ff6b70);--c:light-dark(#d98a00,#f7b733);--f:light-dark(#7d4cc9,#b18cf0);--warn:light-dark(#c2410c,#fb923c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.num{font-family:Archivo,Inter,sans-serif;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.05;margin:0;font-weight:800}
h2{font-size:20px;margin:0;font-weight:700}
h3{font-size:16px;margin:0;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid transparent}
header.top.sc{border-color:var(--line)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.wr{flex-wrap:wrap}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.sec{margin:22px 0 6px;display:flex;align-items:baseline;gap:8px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--accink)}.ghost{background:transparent;color:var(--acc);padding:0 8px}
.danger{color:var(--p)}.blk{width:100%}.big{min-height:52px;font-size:17px}
.ico{width:44px;padding:0;flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;min-height:44px;padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:110px}
label.f{display:block;margin:10px 0}label.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;border-radius:999px;padding:0 14px;font-size:14px;background:var(--soft)}
.chip.on{background:var(--ink);color:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border-radius:0;flex-direction:column;gap:2px;min-height:62px;font-size:12px;color:var(--mut);font-weight:600}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ring */
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lbl b{font:800 34px/1 Archivo,sans-serif}
.mac{margin:8px 0}.mac .row{font-size:14px}.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:9px}
.water{display:flex;gap:6px;flex-wrap:wrap}.water button{width:34px;min-height:40px;padding:0;border-radius:9px;background:var(--soft)}
.water button.on{background:var(--acc)}
.meal-h{display:flex;align-items:center;gap:8px;padding:2px 0 8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-radius:0;min-height:52px;text-align:left;font-weight:400;justify-content:flex-start}
.item .t{flex:1;min-width:0}.item .t div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .k{font:700 16px Archivo,sans-serif;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
/* workout */
.ws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.ws div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}.ws b{display:block;font:800 20px Archivo,sans-serif;white-space:nowrap}
.ex h3{color:var(--acc)}
.sets{width:100%;border-collapse:separate;border-spacing:0 4px;margin-top:6px}
.sets th{font-size:12px;color:var(--mut);font-weight:600;text-align:center;padding:0 2px}
.sets td{padding:0 2px;text-align:center}
.sets td:nth-child(2){font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.sets input{min-height:40px;text-align:center;padding:0 4px;font-weight:600}
.sets tr.done td{background:var(--okbg)}.sets tr.done td:first-child{border-radius:10px 0 0 10px}.sets tr.done td:last-child{border-radius:0 10px 10px 0}
.sets tr.done input{background:transparent}
.stype{min-height:40px;width:40px;padding:0;font:700 15px Archivo,sans-serif;background:transparent}
.stype.w{color:var(--c)}.stype.d{color:var(--f)}.stype.x{color:var(--p)}
.chk{min-height:40px;width:44px;padding:0;background:var(--soft)}
.chk svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none}
tr.done .chk{background:var(--ok);color:#fff}
.note{min-height:36px;font-size:14px;background:transparent;padding:0;border:0}
#rest{position:fixed;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom));z-index:19;display:none}
#rest .in{max-width:640px;margin:0 auto;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 12px;position:relative;overflow:hidden}
#rest .pg{position:absolute;left:0;top:0;bottom:0;background:var(--acc);opacity:.35}
#rest b{font:800 24px Archivo,sans-serif;position:relative}#rest button{position:relative;min-height:38px;background:rgba(127,127,127,.25);color:inherit;padding:0 12px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .pn{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px;margin:0 auto;animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet .pn{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
/* charts */
.cols{display:flex;align-items:flex-end;gap:4px;height:130px;position:relative;margin-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.cols .c i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}
.cols .c span{font-size:11px;color:var(--mut);white-space:nowrap}
.cols .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--mut);opacity:.6}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hb .bar{margin:0;height:10px}.hb b{text-align:right;font-family:Archivo}
.fig{position:relative;height:180px;margin-top:8px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat3 b{display:block;font:800 26px/1.1 Archivo,sans-serif;white-space:nowrap}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.pr{color:var(--c);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;background:transparent;font-size:14px}.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media(max-width:400px){.hero{grid-template-columns:124px minmax(0,1fr);gap:12px}.ring{width:124px;height:124px}.ring .lbl b{font-size:28px}.hb{grid-template-columns:80px minmax(0,1fr) 30px}}
</style>
</head>

</div></nav>

const shard=k=>k==='core'?S.core:k[0]==='w'?(S.w[k.slice(2)]??={items:[],u:0}):(S.f[k.slice(2)]??={days:{},u:0});
let dirty=new Set(),col=null,cloud='local',flushT=null,flushing=false;
function persist(){try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}
function save(k){shard(k).u=Date.now();dirty.add(k);persist();if(col){clearTimeout(flushT);flushT=setTimeout(flush,1200)}}
async function flush(){
  if(!col||flushing)return;flushing=true;
  try{while(dirty.size){const k=[...dirty][0];dirty.delete(k);
    try{await col.doc(k).set(clone(shard(k)))}catch(e){
      if(e&&e.code==='quota_exceeded'){toast('La nube está llena: copia tu respaldo en Perfil')}
      else if(e&&e.code==='invalid_argument'){cloud='local';col=null;break}
      else{dirty.add(k);setTimeout(flush,4000);break}}}}
  finally{flushing=false}
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    const c=db.collection('data/users/'+id);
    const snap=await Promise.race([c.limit(1000).get(),new Promise((_,j)=>setTimeout(()=>j('t'),10000))]);
    const seen=new Set();
    for(const d of snap.docs){const k=d.id,v=d.data();if(!v)continue;seen.add(k);
      const loc=shard(k);
      if((v.u||0)>(loc.u||0)){const nv=clone(v);if(k==='core')S.core={...defCore(),...nv};else if(k[0]==='w')S.w[k.slice(2)]=nv;else S.f[k.slice(2)]=nv}
      else if((loc.u||0)>(v.u||0))dirty.add(k)}
    const keys=['core',...Object.keys(S.w).map(m=>'w-'+m),...Object.keys(S.f).map(m=>'f-'+m)];
    for(const k of keys)if(!seen.has(k)&&(shard(k).u||0)>0)dirty.add(k);
    col=c;cloud='cloud';persist();render();flush();
  }catch(e){cloud='local'}
}

function dayOf(d,create){const m=d.slice(0,7),s=S.f[m];if(s&&s.days[d])return s.days[d];if(!create)return null;const sh=shard('f-'+m);return sh.days[d]={m:{b:[],l:[],d:[],s:[]},water:0}}
function dayTot(d){const t={k:0,p:0,c:0,f:0};const x=dayOf(d);if(x)for(const [mk] of MEALS)for(const e of x.m[mk]||[]){t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f}return t}
function prevSets(eid,skip){for(const w of allW()){if(w.id===skip)continue;const e=w.ex.find(x=>x.eid===eid);if(e)return e.sets}return null}
function setTxt(k,s){if(!s)return '—';if(k==='t')return `${s.r} s`;if(k==='c')return `${s.kg} km · ${s.r} min`;if(k==='bw')return s.kg?`+${s.kg} × ${s.r}`:`${s.r} reps`;return `${s.kg} kg × ${s.r}`}
function wVol(w){let v=0;for(const e of w.ex){const k=exById(e.eid).k;if(k==='w'||k==='bw')for(const s of e.sets)if(s.done!==false)v+=num(s.kg)*num(s.r)}return v}
function exHist(eid){const out=[];for(const w of allW()){const e=w.ex.find(x=>x.eid===eid);if(e)out.push({w,sets:e.sets})}return out}
function bestOf(k,sets){let b=0;for(const s of sets){const kg=num(s.kg),r=num(s.r);const v=k==='w'?e1rm(kg,r):k==='c'?kg:r;if(v>b)b=v}return b}

const figData=new Map();let figN=0;
function fig(pts,opt={}){const id='g'+(++figN);figData.set(id,{pts,opt});return `<div class="fig" data-fig="${id}"><svg></svg></div>`}
const figRO=new ResizeObserver(es=>{for(const e of es)drawFig(e.target)});
function drawFigs(root){root.querySelectorAll('[data-fig]').forEach(el=>{figRO.observe(el);drawFig(el)})}
function drawFig(el){
  const d=figData.get(el.dataset.fig);if(!d)return;const s=el.querySelector('svg');const W=el.clientWidth,H=el.clientHeight;if(!W)return;
  const {pts,opt}=d;if(pts.length<2){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".55" font-size="14">Registra al menos 2 días para ver la tendencia</text>`;return}
  const L=38,R=10,T=12,B=24;const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const X=i=>L+(W-L-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".55">${r1(v)}</text>`}
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=path+`L${X(pts.length-1)},${H-B}L${L},${H-B}Z`;
  const lab=[0,pts.length-1];if(W>420&&pts.length>4)lab.splice(1,0,Math.floor((pts.length-1)/2));
  const lt=lab.map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="11" fill="currentColor" opacity=".55">${esc(pts[i].x)}</text>`).join('');
  const last=pts[pts.length-1];
  s.innerHTML=`${g}<path d="${area}" fill="var(--acc)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${pts.length<40?pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="var(--acc)"/>`).join(''):''}<circle cx="${X(pts.length-1)}" cy="${Y(last.y)}" r="5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>${lt}`;
}
function cols(arr,goal){const mx=Math.max(goal||0,...arr.map(a=>a.v),1);return `<div class="cols">${goal?`<div class="goal" style="bottom:calc(20px + (100% - 20px) * ${goal/mx})"></div>`:''}${arr.map(a=>`<div class="c"><i style="height:calc((100% - 20px) * ${a.v/mx});${a.col?`background:${a.col}`:''}" title="${esc(a.t||a.v)}"></i><span>${esc(a.l)}</span></div>`).join('')}</div>`}

function vHoy(){
  const g=S.core.goals,d=fdate_,t=dayTot(d),day=dayOf(d)||{m:{b:[],l:[],d:[],s:[]},water:0};
  const left=Math.round(g.kcal-t.k),pc=Math.min(1,t.k/(g.kcal||1)),C=2*Math.PI*64;
  const isT=d===today();
  const mac=(n,v,gv,c)=>`<div class="mac"><div class="row"><b>${n}</b><span class="sp"></span><span class="num"><b>${Math.round(v)}</b> <span class="mut">/ ${gv} g</span></span></div><div class="bar"><i style="width:${Math.min(100,v/(gv||1)*100)}%;background:${c}"></i></div></div>`;
  const water=Array.from({length:g.water},(_,i)=>`<button class="${i<day.water?'on':''}" data-a="water" data-v="${i+1}" aria-label="${i+1} vasos"></button>`).join('');
  const meals=MEALS.map(([mk,mn])=>{const it=day.m[mk]||[];const tk=it.reduce((a,e)=>a+e.k,0),tp=it.reduce((a,e)=>a+e.p,0);
    const yd=dayOf(addDays(d,-1));const canCopy=!it.length&&yd&&(yd.m[mk]||[]).length;
    return `<div class="card"><div class="meal-h"><h3>${mn}</h3><span class="sp"></span>${it.length?`<span class="pill">P ${Math.round(tp)} g</span><b class="num">${fmtN(tk)}</b><span class="mut xs">kcal</span><button class="ghost ico" data-a="mealMenu" data-v="${mk}" aria-label="Opciones">•••</button>`:''}</div>
    ${it.map(e=>`<button class="item" data-a="editEntry" data-m="${mk}" data-v="${e.id}"><div class="t"><div>${esc(e.n)}</div><div class="mut xs">${e.g?`${r1(e.g)} g · `:''}P ${r1(e.p)} · C ${r1(e.c)} · G ${r1(e.f)}</div></div><span class="k">${fmtN(e.k)}</span></button>`).join('')}
    <div class="row" style="margin-top:6px"><button class="ghost" data-a="addFood" data-v="${mk}">+ Agregar alimento</button><span class="sp"></span>${canCopy?`<button class="ghost xs" data-a="copyY" data-v="${mk}">Copiar de ayer</button>`:''}</div></div>`}).join('');
  return `<header class="top"><div class="row"><button class="ico" data-a="day" data-v="-1" aria-label="Día anterior">‹</button><div class="sp" style="text-align:center"><h2>${isT?'Hoy':esc(fdate(d))}</h2>${isT?`<div class="mut xs">${esc(fdate(d))}</div>`:`<button class="ghost xs" style="min-height:24px" data-a="day" data-v="0">Volver a hoy</button>`}</div><button class="ico" data-a="day" data-v="1" aria-label="Día siguiente">›</button></div></header>
  <div class="card"><div class="hero"><div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--soft)" stroke-width="14"/><circle cx="75" cy="75" r="64" fill="none" stroke="${left<0?'var(--p)':'var(--acc)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc)}"/></svg><div class="lbl"><b>${fmtN(Math.abs(left))}</b><span class="mut xs">${left<0?'kcal de más':'kcal restantes'}</span></div></div>
  <div><div class="row sm"><span class="mut">Consumidas</span><span class="sp"></span><b class="num">${fmtN(t.k)}</b></div><div class="row sm" style="margin-bottom:6px"><span class="mut">Meta</span><span class="sp"></span><b class="num">${fmtN(g.kcal)}</b></div>${mac('Proteína',t.p,g.p,'var(--p)')}${mac('Carbs',t.c,g.c,'var(--c)')}${mac('Grasa',t.f,g.f,'var(--f)')}</div></div></div>

}

function sheetPlates(){const t=plateKg,bar=plateBar;const per=Math.max(0,(t-bar)/2);let rem=per;const P=[25,20,15,10,5,2.5,1.25],out=[];for(const p of P){while(rem>=p-1e-9){out.push(p);rem=r1(rem-p)}}

function finishW(){
  const a=S.core.active;const ex=a.ex.map(e=>({...e,sets:e.sets.filter(s=>s.done).map(s=>({t:s.t||'n',kg:num(s.kg),r:num(s.r)}))})).filter(e=>e.sets.length);
  if(!ex.length){ask('No marcaste ninguna serie. ¿Descartar el entrenamiento?','Descartar',()=>{S.core.active=null;restEnd=0;save('core');render()},true);return}
  const w={id:a.id,name:a.name||'Entrenamiento',rid:a.rid,start:a.start,end:Date.now(),ex};
  const prs=[];for(const e of ex){const x=exById(e.eid);const hist=exHist(e.eid);if(!hist.length)continue;
    const old=Math.max(...hist.map(h=>bestOf(x.k,h.sets))),nw=bestOf(x.k,e.sets);if(nw>old+1e-9)prs.push({n:x.n,v:nw,k:x.k});
    if(x.k==='w'){const ow=Math.max(...hist.flatMap(h=>h.sets.map(s=>num(s.kg)))),nwk=Math.max(...e.sets.map(s=>s.kg));if(nwk>ow)prs.push({n:x.n,v:nwk,k:'kg'})}}
  w.prs=prs.length;
  const m=ds(new Date(w.start)).slice(0,7);shard('w-'+m).items.push(w);save('w-'+m);
  // recordar valores en la rutina
  if(a.rid){const r=S.core.routines.find(x=>x.id===a.rid);if(r)r.last=Date.now()}
  S.core.active=null;restEnd=0;save('core');render();

  ${!a.rid?`<button class="blk" style="margin-top:12px" data-a="wToRoutine" data-v="${w.id}">Guardar como rutina</button>`:''}
  <button class="pri blk big" style="margin-top:10px" data-a="closeSheet">Listo</button>`);
}

/* ---------- PROGRESO ---------- */
let proView='ent';
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);const dw=(d.getDay()+6)%7;d.setDate(d.getDate()-dw);return d.getTime()}
function vPro(){
  return `<header class="top"><h1>Progreso</h1><div class="seg" style="margin-top:10px">${[['ent','Entrenos'],['nut','Nutrición'],['cuerpo','Cuerpo']].map(([k,n])=>`<button class="${proView===k?'on':''}" data-a="proV" data-v="${k}">${n}</button>`).join('')}</div></header>`+(proView==='ent'?proEnt():proView==='nut'?proNut():proBody());
}
function proEnt(){
  const W=allW();if(!W.length)return `<div class="card empty">Cuando termines tu primer entrenamiento verás aquí tus récords, volumen y gráficas por ejercicio.</div>`;
  const ws=weekStart(Date.now());const thisW=W.filter(w=>w.start>=ws).length;
  let streak=0;for(let k=0;k<200;k++){const a=ws-k*7*864e5,b=a+7*864e5;if(W.some(w=>w.start>=a&&w.start<b))streak++;else if(k>0)break}
  const t30=Date.now()-30*864e5,W30=W.filter(w=>w.start>=t30);const v30=W30.reduce((a,w)=>a+wVol(w),0);
  const weeks=[];for(let k=11;k>=0;k--){const a=ws-k*7*864e5,b=a+7*864e5;const d=new Date(a);weeks.push({l:k%3===0?`${d.getDate()}/${d.getMonth()+1}`:'',v:W.filter(w=>w.start>=a&&w.start<b).length})}
  const mus={};for(const w of W30)for(const e of w.ex){const m=exById(e.eid).m||'Otro';mus[m]=(mus[m]||0)+e.sets.filter(s=>s.t!=='w').length}
  const mm=Object.entries(mus).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...mm.map(x=>x[1]));
  const exs={};for(const w of W)for(const e of w.ex){exs[e.eid]??={n:0,last:w.start};exs[e.eid].n++}
  const exl=Object.entries(exs).sort((a,b)=>b[1].n-a[1].n);

   save('core');render()},
 addSet:t=>{const e=S.core.active.ex[+t.dataset.x];const l=e.sets[e.sets.length-1];e.sets.push({t:'n',kg:l?l.kg:'',r:l?l.r:'',done:false});save('core');render()},
 setType:t=>{const x=+t.dataset.x,y=+t.dataset.y;openSheet(()=>`<h2>Tipo de serie</h2><div style="display:grid;gap:8px;margin-top:12px">${Object.entries(STN).map(([k,n])=>`<button data-a="setType2" data-v="${k}" data-x="${x}" data-y="${y}">${n}</button>`).join('')}<button class="danger" data-a="delSet" data-x="${x}" data-y="${y}">Eliminar serie</button></div>`)},
 setType2:t=>{S.core.active.ex[+t.dataset.x].sets[+t.dataset.y].t=t.dataset.v;save('core');closeAll();render()},
 delSet:t=>{const e=S.core.active.ex[+t.dataset.x];e.sets.splice(+t.dataset.y,1);save('core');closeAll();render()},
 restCycle:t=>{const e=S.core.active.ex[+t.dataset.x];const O=[0,30,60,90,120,150,180,240,300];e.rest=O[(O.indexOf(e.rest)+1)%O.length]??90;save('core');render()},
 exMenu:t=>{const i=+t.dataset.x;openSheet(()=>`<h2>${esc(exById(S.core.active.ex[i].eid).n)}</h2><div style="display:grid;gap:8px;margin-top:12px"><button data-a="exMove" data-x="${i}" data-v="-1">Subir</button><button data-a="exMove" data-x="${i}" data-v="1">Bajar</button><button data-a="viewEx" data-v="${S.core.active.ex[i].eid}">Ver historial y récords</button><button class="danger" data-a="exDel" data-x="${i}">Quitar ejercicio</button></div>`)},
 exMove:t=>{const L=S.core.active.ex,i=+t.dataset.x,j=i+ +t.dataset.v;if(j<0||j>=L.length)return closeAll();[L[i],L[j]]=[L[j],L[i]];save('core');closeAll();render()},
 exDel:t=>{S.core.active.ex.splice(+t.dataset.x,1);save('core');closeAll();render()},
 restAdd:t=>{if(!restEnd)return;restEnd+= +t.dataset.v*1000;restDur=Math.max(restDur+ +t.dataset.v,1);updRest()},
 restSkip:()=>{restEnd=0;updRest()},
 finish:()=>{const a=S.core.active;const pend=a.ex.some(e=>e.sets.some(s=>!s.done&&(s.kg!==''||s.r!=='')));if(pend)ask('Hay series sin marcar. Solo se guardarán las marcadas. ¿Terminar?','Terminar',finishW);else finishW()},
 discard:()=>ask('¿Descartar este entrenamiento? No se guardará nada.','Descartar',()=>{S.core.active=null;restEnd=0;save('core');render()},true),
 plates:()=>openSheet(sheetPlates),
 viewW:t=>openSheet(()=>sheetW(t.dataset.v)),
 viewEx:t=>openSheet(()=>sheetEx(t.dataset.v)),
 delW:t=>{const id=t.dataset.v;ask('¿Eliminar este entrenamiento?','Eliminar',()=>{for(const [m,s] of Object.entries(S.w)){const i=s.items.findIndex(w=>w.id===id);if(i>=0){s.items.splice(i,1);save('w-'+m)}}render()},true)},
 wToRoutine:t=>{const w=allW().find(x=>x.id===t.dataset.v);S.core.routines.push({id:uid(),name:w.name,ex:w.ex.map(e=>({eid:e.eid,sets:e.sets.filter(s=>s.t!=='w').length||e.sets.length,reps:String(Math.max(...e.sets.map(s=>s.r))),rest:e.rest??S.core.rest}))});save('core');closeAll();render();toast('Rutina guardada')},
 newRoutine:()=>{rEd={id:uid(),name:'',ex:[]};openSheet(sheetRoutine)},
 editRoutine:t=>{rEd=clone(S.core.routines.find(x=>x.id===t.dataset.v));openSheet(sheetRoutine)},
 rAddEx:()=>{pick={sel:[],q:'',m:'',for:'r'};openSheet(sheetPick)},
 rMove:t=>{const L=rEd.ex,i=+t.dataset.x,j=i+ +t.dataset.v;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];rerSheet()},
 rDel:t=>{rEd.ex.splice(+t.dataset.x,1);rerSheet()},
 saveRoutine:()=>{if(!rEd.name.trim())rEd.name='Rutina '+(S.core.routines.length+1);const i=S.core.routines.findIndex(x=>x.id===rEd.id);i>=0?S.core.routines[i]=rEd:S.core.routines.push(rEd);save('core');closeAll();render()},
 delRoutine:()=>{const id=rEd.id;ask('¿Eliminar esta rutina?','Eliminar',()=>{S.core.routines=S.core.routines.filter(x=>x.id!==id);save('core');render()},true)},
 sampleR:()=>{const mk=(name,ids)=>({id:uid(),name,ex:ids.map(([eid,sets,reps])=>({eid,sets,reps,rest:eid==='squat'||eid==='dl'||eid==='bench'?150:90}))});
   S.core.routines.push(mk('Push',[['bench',4,'5-8'],['dbi',3,'8-12'],['ohp',3,'6-10'],['lra',3,'12-15'],['tpush',3,'10-12']]),mk('Pull',[['pull',4,'6-10'],['brow',3,'8-10'],['lat',3,'10-12'],['face',3,'15'],['bcurl',3,'8-12'],['ham',2,'10-12']]),mk('Pierna',[['squat',4,'5-8'],['rdl',3,'8-10'],['lp',3,'10-12'],['lcurl',3,'10-12'],['calf',4,'12-15']]));save('core');render()},
 /* progreso */
 proV:t=>{proView=t.dataset.v;render()},moreH:()=>{histN+=10;render()},
 logBW:()=>{const w=num($('#bw').value),d=$('#bwd').value||today();if(w<=0){toast('Escribe tu peso');return}S.core.body=S.core.body.filter(b=>b.d!==d);S.core.body.push({d,w:r1(w)});if(d===today())S.core.profile.weight=r1(w);save('core');render();toast('Peso guardado')},
 delBW:t=>{S.core.body=S.core.body.filter(b=>b.d!==t.dataset.v);save('core');render()},
 /* perfil */
 useCalc:()=>{const c=calcGoals();Object.assign(S.core.goals,{kcal:c.kcal,p:c.p,c:c.c,f:c.f});save('core');render();toast('Metas actualizadas')},
 delCEx:t=>{S.core.customEx=S.core.customEx.filter(e=>e.id!==t.dataset.v);save('core');render()},
 delCF:t=>{S.core.customFoods=S.core.customFoods.filter(e=>e.id!==t.dataset.v);save('core');render()},
 backup:async()=>{const txt=JSON.stringify({app:'forja',v:1,at:new Date().toISOString(),data:S});try{await navigator.clipboard.writeText(txt);toast('Respaldo copiado: pégalo en Notas o en un correo')}catch(e){openSheet(()=>`<h2>Tu respaldo</h2><p class="mut sm">Selecciona todo el texto y cópialo.</p><textarea readonly style="min-height:240px">${esc(txt)}</textarea><button class="blk" data-a="closeSheet" style="margin-top:8px">Cerrar</button>`)}},
 restore:()=>openSheet(()=>`<h2>Restaurar respaldo</h2><p class="mut sm">Pega aquí el texto de tu respaldo. Reemplaza los datos actuales.</p><textarea id="rs"></textarea><button class="pri blk big" style="margin-top:10px" data-a="restore2">Restaurar</button>`),
 restore2:()=>{try{const o=JSON.parse($('#rs').value);const d=o.data||o;if(!d.core)throw 0;S={core:{...defCore(),...d.core},w:d.w||{},f:d.f||{}};
   const now=Date.now();save('core');for(const m in S.w)save('w-'+m);for(const m in S.f)save('f-'+m);S.core.u=now;closeAll();render();toast('Datos restaurados')}catch(e){toast('Ese texto no es un respaldo válido')}},
 wipe:()=>ask('¿Borrar TODOS tus datos? No se puede deshacer.','Borrar todo',()=>{const old=S;S={core:defCore(),w:{},f:{}};save('core');for(const m in old.w){S.w[m]={items:[],u:0};save('w-'+m)}for(const m in old.f){S.f[m]={days:{},u:0};save('f-'+m)}render()},true)
};
document.addEventListener('click',e=>{
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(x){}}
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e)}});
let inT=null;
document.addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(!i)return;
  if(i==='set'){const s=S.core.active.ex[+t.dataset.x].sets[+t.dataset.y];s[t.dataset.f]=t.value===''?'':num(t.value);save('core');updStats()}
  else if(i==='note'){S.core.active.ex[+t.dataset.x].note=t.value;save('core')}
  else if(i==='wname'){S.core.active.name=t.value;save('core')}
  else if(i==='fq'){addCtx.q=t.value;const c=addCtx;const q=c.q.trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');let L=c.filt==='rec'?S.core.recents.map(foodById).filter(Boolean):c.filt==='mine'?S.core.customFoods:allFoods();if(q)L=L.filter(f=>f.n.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').includes(q));const el=$('#flist');if(el)el.innerHTML=foodList(L)}
  else if(i==='qg'){addCtx.g=num(t.value);updQ()}
  else if(i==='pq'){pick.q=t.value;clearTimeout(inT);inT=setTimeout(()=>{const pos=t.selectionStart;rerSheet();const n=document.querySelector('[data-i=pq]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}},180)}
  else if(i==='rname'){rEd.name=t.value}
  else if(i==='rset'){const e=rEd.ex[+t.dataset.x];e[t.dataset.f]=t.dataset.f==='reps'?t.value:num(t.value)}
  else if(i==='pk'||i==='pb'){if(i==='pk')plateKg=num(t.value);else plateBar=num(t.value);const per=Math.max(0,(plateKg-plateBar)/2);let rem=per;const out=[];for(const p of [25,20,15,10,5,2.5,1.25])while(rem>=p-1e-9){out.push(p);rem=r1(rem-p)}$('#pout').innerHTML=plateOut(out,rem,per)}
  else if(i==='goal'){S.core.goals[t.dataset.f]=num(t.value);save('core')}
  else if(i==='prof'){const f=t.dataset.f;S.core.profile[f]=f==='sex'||f==='goal'?t.value:num(t.value);save('core');const c=$('#calc');if(c)c.innerHTML=calcTxt(calcGoals())}
  else if(i==='drest'){S.core.rest=num(t.value);save('core')}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.i==='pb'||t.dataset.i==='prof')t.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)closeSheet()});

render();initCloud();
try{if('serviceWorker' in navigator&&window.top===window&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
